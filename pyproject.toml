[project]
name = "glasshouse"
version = "0.1.0"
description = "A runtime that makes LLM agent execution visible, previewable, gated and reversible."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Temirlan Rakhimgaliyev" }]
keywords = ["llm", "agents", "claude", "anthropic", "observability", "dry-run", "sse"]
dependencies = []

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn>=0.29"]
anthropic = ["anthropic>=0.40"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "fastapi>=0.110", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/glasshouse"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
